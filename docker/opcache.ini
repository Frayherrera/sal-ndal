; OPcache: guarda el PHP compilado en memoria (menos CPU por petición).
; validate_timestamps=1 + revalidate_freq=2: detecta cambios de código sin reiniciar
; (necesario porque en desarrollo el proyecto se monta como volumen).
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
