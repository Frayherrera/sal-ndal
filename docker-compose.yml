services:
  app:
    build: .
    container_name: santini_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # Estas variables tienen prioridad sobre el .env del proyecto
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: santini_db
      DB_USERNAME: santini
      DB_PASSWORD: santini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  # Base de datos solo para desarrollo (en producción se usa AWS RDS)
  db:
    image: mysql:8.0
    container_name: santini_db
    ports:
      # 3307 en el host para no chocar con un MySQL local en 3306
      - "3307:3306"
    environment:
      MYSQL_DATABASE: santini_db
      MYSQL_USER: santini
      MYSQL_PASSWORD: santini
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
